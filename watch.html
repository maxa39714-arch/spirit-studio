<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spirit Studio — Watch</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .watch-wrap{padding:84px clamp(16px,4vw,40px) 50px; display:flex; gap:26px; align-items:flex-start; flex-wrap:wrap;}
  .player-col{flex:1; min-width:280px;}
  .player-frame{
    width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden;
    background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .player-frame iframe{width:100%;height:100%;border:0;}
  .ss-player{width:100%;height:100%;background:#000;display:block;}
  .ss-player::-webkit-media-controls-panel{background:linear-gradient(0deg, rgba(5,6,15,.85), transparent);}
  .player-empty{text-align:center; color:var(--text-dim); font-size:13.5px; padding:20px;}
  .watch-title{font-family:'Anton',sans-serif; font-size:22px; margin-top:18px;}
  .watch-sub{color:var(--text-dim); font-size:13px; margin-top:4px;}
  .watch-nav{display:flex; gap:12px; margin-top:18px;}
  .sidebar-col{width:300px; flex:0 0 auto; max-height:80vh; overflow-y:auto;}
  .sidebar-head{font-family:'Anton',sans-serif; font-size:16px; margin-bottom:12px;}
  .side-ep{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel); margin-bottom:8px; font-size:13px; font-weight:700;
  }
  .side-ep.current{border-color:var(--flame-1); background:rgba(255,90,31,.08);}
  .side-ep .ep-num{
    width:30px;height:30px;border-radius:7px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--void); border:1px solid var(--line); font-size:12px;
  }
  .side-ep.current .ep-num{background:linear-gradient(140deg,var(--flame-1),var(--flame-2)); color:#1A0800; border:none;}
  @media (max-width:880px){
    .sidebar-col{width:100%; max-height:none;}
    .watch-wrap{flex-direction:column;}
  }
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <a href="home.html" class="brand">
    <img src="assets/logo.jpg" alt="Spirit Studio" />
    <span class="brand-word"><span>SPIRIT</span> <span class="flame-text">STUDIO</span></span>
  </a>
  <nav class="main-nav">
    <a href="home.html">Home</a>
    <a href="genres.html">Genres</a>
    <a href="trending.html">Trending</a>
    <a href="latest.html">Latest Episodes</a>
  </nav>
  <div class="header-actions" id="headerActions"></div>
</header>

<div class="watch-wrap">
  <div class="player-col">
    <div class="player-frame" id="playerFrame">
      <div class="player-empty">Loading episode…</div>
    </div>
    <h1 class="watch-title" id="watchTitle"></h1>
    <div class="watch-sub" id="watchSub"></div>
    <div class="watch-nav">
      <a href="#" class="btn btn-ghost" id="prevBtn">← Previous</a>
      <a href="#" class="btn btn-primary" id="nextBtn">Next Episode →</a>
    </div>
  </div>

  <aside class="sidebar-col">
    <div class="sidebar-head">Episodes</div>
    <div id="sideEpList"></div>
  </aside>
</div>

<script type="module" src="js/watch-page.js"></script>
</body>
</html>
