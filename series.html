<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spirit Studio — Series</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .detail-hero{
    padding:130px clamp(18px,4vw,56px) 40px;
    display:flex; gap:34px; flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(70% 60% at 15% 0%, rgba(255,90,31,.16), transparent 60%),
      var(--deep);
  }
  .detail-poster{
    width:220px; height:312px; flex:0 0 auto; border-radius:10px;
    border:1px solid var(--line); position:relative; overflow:hidden;
  }
  .detail-poster .poster-art span{font-size:20px;}
  .detail-info{flex:1; min-width:260px;}
  .detail-title{font-family:'Anton',sans-serif; font-size:clamp(28px,5vw,42px); margin-bottom:12px;}
  .detail-desc{color:var(--text-lo); font-size:14.5px; line-height:1.7; max-width:640px; margin-bottom:20px;}
  .episodes-section{padding:36px clamp(18px,4vw,56px) 60px;}
  .episodes-head{font-family:'Anton',sans-serif; font-size:22px; margin-bottom:16px;}
  .ep-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 16px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel); margin-bottom:10px; transition:border-color .2s ease, background .2s ease;
  }
  .ep-card:hover{border-color:rgba(255,146,60,.5); background:var(--panel-hi);}
  .ep-left{display:flex; align-items:center; gap:14px;}
  .ep-num{
    width:38px;height:38px;border-radius:8px; display:grid; place-items:center;
    background:linear-gradient(140deg,var(--flame-1),var(--flame-2)); color:#1A0800; font-weight:800; font-size:13px; flex:0 0 auto;
  }
  .ep-title{font-weight:700; font-size:13.5px;}
  .ep-play{
    width:34px;height:34px; border-radius:50%; display:grid; place-items:center;
    background:var(--void); border:1px solid var(--line); flex:0 0 auto;
  }
  .ep-play svg{width:14px;height:14px;color:var(--flame-2);}
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <a href="home.html" class="brand">
    <img src="assets/logo.jpg" alt="Spirit Studio" />
    <span class="brand-word"><span>SPIRIT</span> <span class="flame-text">STUDIO</span></span>
  </a>
  <nav class="main-nav">
    <a href="home.html">Home</a>
    <a href="genres.html">Genres</a>
    <a href="trending.html">Trending</a>
    <a href="latest.html">Latest Episodes</a>
  </nav>
  <div class="header-actions" id="headerActions"></div>
</header>

<section class="detail-hero">
  <div class="detail-poster" id="detailPoster">
    <div class="poster-art"><span id="detailPosterTitle"></span></div>
  </div>
  <div class="detail-info">
    <h1 class="detail-title" id="detailTitle">Loading…</h1>
    <div class="hero-meta" id="detailMeta"></div>
    <p class="detail-desc" id="detailDesc"></p>
    <div class="hero-actions">
      <a href="#" class="btn btn-primary" id="watchFirstBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Watch Episode 1
      </a>
    </div>
  </div>
</section>

<section class="episodes-section">
  <h2 class="episodes-head">Episodes</h2>
  <div id="episodeContainer"></div>
</section>

<script type="module" src="js/series-page.js"></script>
</body>
</html>
