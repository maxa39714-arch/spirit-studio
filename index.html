<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spirit Studio</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="stylesheet" href="css/style.css" />
<style>
  body{min-height:100vh; display:flex; flex-direction:column;}
  .welcome-wrap{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 20px;
    text-align:center;
    background:
      radial-gradient(70% 60% at 50% 0%, rgba(255,90,31,.16), transparent 60%),
      var(--void);
  }
  .welcome-logo{width:74px;height:74px;border-radius:16px;overflow:hidden;margin-bottom:18px;
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 24px 50px -18px rgba(255,90,31,.5);}
  .welcome-logo img{width:100%;height:100%;object-fit:cover;}
  .welcome-title{font-family:'Anton',sans-serif; font-size:clamp(26px,6vw,36px); margin-bottom:8px;}
  .welcome-sub{color:var(--text-lo); font-size:14px; max-width:360px; margin-bottom:36px;}
  .choice-grid{display:grid; gap:16px; width:100%; max-width:380px;}
  .choice-card{
    display:flex; align-items:center; gap:14px;
    padding:18px 20px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    text-align:left;
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .choice-card:hover{transform:translateY(-3px); border-color:rgba(255,146,60,.5); background:var(--panel-hi);}
  .choice-icon{
    width:44px;height:44px;flex:0 0 auto;border-radius:10px;
    display:grid;place-items:center;
    background:linear-gradient(140deg,var(--flame-1),var(--flame-2));
  }
  .choice-icon svg{width:22px;height:22px;color:#1A0800;}
  .choice-text b{display:block;font-size:15px;margin-bottom:2px;}
  .choice-text span{font-size:12.5px;color:var(--text-dim);}
  .choice-card.admin .choice-icon{background:var(--panel-hi);border:1px solid var(--line);}
  .choice-card.admin .choice-icon svg{color:var(--flame-2);}
  #authError{
    margin-top:16px;font-size:12.5px;color:#FF8A80;
    background:rgba(255,90,31,.08);border:1px solid rgba(255,90,31,.25);
    padding:9px 14px;border-radius:8px;display:none;max-width:380px;
  }
</style>
</head>
<body class="intro-lock">

<!-- intro splash -->
<div class="intro" id="introSplash">
  <div class="intro-mark"><img src="assets/logo.jpg" alt="Spirit Studio" /></div>
  <div class="intro-word"><span class="flame-text">SPIRIT STUDIO</span></div>
  <div class="intro-line"></div>
</div>

<div class="welcome-wrap">
  <div class="welcome-logo"><img src="assets/logo.jpg" alt="Spirit Studio" /></div>
  <h1 class="welcome-title">Welcome to <span class="flame-text">Spirit Studio</span></h1>
  <p class="welcome-sub">Choose how you'd like to continue.</p>

  <div class="choice-grid">
    <button class="choice-card" id="btnViewer">
      <span class="choice-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <span class="choice-text"><b>Continue as Viewer</b><span>Browse and watch series</span></span>
    </button>

    <button class="choice-card admin" id="btnAdmin">
      <span class="choice-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/></svg>
      </span>
      <span class="choice-text"><b>Continue as Admin</b><span>Sign in with Google</span></span>
    </button>
  </div>

  <div id="authError">Ye Google account admin ke liye authorized nahi hai. Viewer ke roop me continue karein.</div>
</div>

<script type="module">
  import { auth } from "./js/firebase-config.js";
  import { signInWithGoogle, isAdmin } from "./js/auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Already signed in as admin from an earlier visit? Skip straight to
  // the panel instead of asking them to choose/sign in again.
  onAuthStateChanged(auth, (user) => {
    if (isAdmin(user)){
      window.location.href = "admin.html";
    }
  });

  document.getElementById('btnViewer').addEventListener('click', () => {
    window.location.href = "home.html";
  });

  document.getElementById('btnAdmin').addEventListener('click', () => {
    const errBox = document.getElementById('authError');
    errBox.style.display = 'none';
    signInWithGoogle(() => { errBox.style.display = 'block'; });
  });

  // intro splash — plays once per browser session
  const intro = document.getElementById('introSplash');
  const seen = sessionStorage.getItem('ss_intro_seen');
  if (seen){
    intro.remove();
    document.body.classList.remove('intro-lock');
  } else {
    sessionStorage.setItem('ss_intro_seen', '1');
    setTimeout(() => {
      intro.classList.add('hide');
      document.body.classList.remove('intro-lock');
    }, 2100);
  }
</script>
</body>
</html>
